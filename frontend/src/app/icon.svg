<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Thermal Outer Ring Gradient (Cyan to Amber/Flame) -->
    <linearGradient id="thermalRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="1" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#c2410c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Metallic Ring Gradient -->
    <linearGradient id="innerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for subtle outer glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Thermal Ambient Glow Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#thermalRing)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" opacity="0.4" />

  <!-- Primary Precision Thermal Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#thermalRing)" stroke-width="10" stroke-linecap="round" />

  <!-- Orbiting Thermal Nodes on Circle -->
  <circle cx="256" cy="30" r="10" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="482" cy="256" r="8" fill="#ef4444" />
  <circle cx="30" cy="256" r="8" fill="#06b6d4" />
  <circle cx="256" cy="482" r="7" fill="#3b82f6" />

  <!-- Middle Concentric Tech Ring (Segmented) -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#innerRing)" stroke-width="4" stroke-dasharray="16 12 42 12" opacity="0.85" />

  <!-- Inner Ambient Heat Core Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" />

  <!-- Center Circular Thermal Shelter Emblem -->
  <!-- Outer Shield Ring -->
  <circle cx="256" cy="256" r="126" fill="#0b1120" stroke="#334155" stroke-width="5" />

  <!-- Thermal Shelter Structure: Angular Apex Shelter inside Circle -->
  <path d="M 256 160 L 334 238 L 314 238 L 314 316 L 198 316 L 198 238 L 178 238 Z" fill="#1e293b" stroke="url(#thermalRing)" stroke-width="6" stroke-linejoin="round" />

  <!-- Radiant Inner Solar Energy Sphere -->
  <circle cx="256" cy="266" r="30" fill="#fbbf24" stroke="#f97316" stroke-width="4" filter="url(#glow)" />

  <!-- Thermal Wave Arcs Radiating Upward within the shelter -->
  <path d="M 230 220 Q 256 202 282 220" fill="none" stroke="#fdba74" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
  <path d="M 238 200 Q 256 186 274 200" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.85" />
</svg>
